name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install stable toolchain (with clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.1

      - name: rustfmt
        run: cargo +nightly fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features

      - name: build
        run: cargo build --all-targets --all-features

      - name: Install cargo-nextest
        uses: taiki-e/install-action@84c20235bedc3797c7e2cd6da1ed885a1f1faa97 # v2.62.13
        with:
          tool: cargo-nextest

      - name: Enable /dev/uinput
        run: |
          sudo modprobe uinput
          sudo chmod 666 /dev/uinput

      - name: test
        run: cargo nextest run --all-features
