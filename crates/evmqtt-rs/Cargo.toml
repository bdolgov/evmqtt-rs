[package]
name = "evmqtt-rs"
version = "0.1.0"
publish = true
keywords = ["mqtt", "smart-home", "home-assistant", "keyboard", "iot"]
description = "evmqtt-rs turns keyboard key presses into MQTT messages."
edition.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
evdev = { version = "0.13", features = ["tokio", "stream-trait"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
tokio-stream = "0.1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
inotify = { version = "0.11", default-features = false, features = ["stream"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time", "test-util"] }
rumqttd = { version = "0.20", default-features = false }
