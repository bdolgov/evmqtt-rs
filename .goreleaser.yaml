version: 2

before:
  hooks:
    - rustup default stable
    - cargo install --locked cargo-zigbuild
    - cargo fetch --locked

builds:
  - builder: rust
    flags:
      - --release
      - --package={{ .ProjectName }}
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-{{ .Arch }}
    wrap_in_directory: true

nfpms:
  - id: packages
    package_name: "{{ .ProjectName }}"
    vendor: "{{ .Env.METADATA_VENDOR }}"
    maintainer: "{{ .Env.METADATA_MAINTAINER }}"
    homepage: "{{ .Env.METADATA_HOMEPAGE }}"
    license: "{{ .Env.METADATA_LICENSE }}"
    description: "{{ .Env.METADATA_DESCRIPTION }}"
    file_name_template: "{{ .ProjectName }}-{{ .Arch }}"
    formats:
      - deb
      - archlinux
      - rpm
      - apk
    bindir: /usr/bin
    overrides:
      apk:
        dependencies:
          - openrc
        contents:
          - src: ./packaging/{{ .ProjectName }}.env
            dst: /etc/{{ .ProjectName }}.env
            type: "config|noreplace"
            file_info:
              mode: 0640
          - src: ./packaging/{{ .ProjectName }}.openrc
            dst: /etc/init.d/{{ .ProjectName }}
            file_info:
              mode: 0755
        scripts:
          postinstall: ./packaging/apk-postinstall.sh
      deb:
        contents:
          - src: ./packaging/{{ .ProjectName }}.service
            dst: /lib/systemd/system/{{ .ProjectName }}.service
          - src: ./packaging/{{ .ProjectName }}.env
            dst: /etc/{{ .ProjectName }}.env.example
      archlinux:
        contents:
          - src: ./packaging/{{ .ProjectName }}.service
            dst: /usr/lib/systemd/system/{{ .ProjectName }}.service
          - src: ./packaging/{{ .ProjectName }}.env
            dst: /etc/{{ .ProjectName }}.env.example
      rpm:
        contents:
          - src: ./packaging/{{ .ProjectName }}.service
            dst: /usr/lib/systemd/system/{{ .ProjectName }}.service
          - src: ./packaging/{{ .ProjectName }}.env
            dst: /etc/{{ .ProjectName }}.env.example

dockers_v2:
  - id: "{{ .ProjectName }}-haos"
    images:
      - "{{ .Env.IMAGE }}-haos"
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: haos_app/Dockerfile
    extra_files:
      - haos_app/run.sh
    build_args:
      VERSION: "{{ .Version }}"
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.description: "{{ .Env.METADATA_DESCRIPTION }}"
      org.opencontainers.image.licenses: "{{ .Env.METADATA_LICENSE }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.title: "{{ .ProjectName }} - HAOS App"
      org.opencontainers.image.url: "{{ .ReleaseURL }}"
      org.opencontainers.image.vendor: "{{ .Env.METADATA_VENDOR }}"
      org.opencontainers.image.version: "{{ .Version }}"
  - id: "{{ .ProjectName }}"
    images:
      - "{{ .Env.IMAGE }}"
    tags:
      - "{{ .Version }}"
      - latest
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.description: "{{ .Env.METADATA_DESCRIPTION }}"
      org.opencontainers.image.licenses: "{{ .Env.METADATA_LICENSE }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.url: "{{ .ReleaseURL }}"
      org.opencontainers.image.vendor: "{{ .Env.METADATA_VENDOR }}"
      org.opencontainers.image.version: "{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
